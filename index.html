<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3DLAT STORE | الملحمة الرياضية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; scroll-behavior: smooth; background-color: #0f0f0f; color: white; overflow-x: hidden; }
        .glass-nav { background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,0.05); }
        .hero-text { text-shadow: 0 0 20px rgba(234, 179, 8, 0.5); }
        .product-card { background: #1a1a1a; transition: 0.5s; border: 1px solid #222; overflow: hidden; position: relative; }
        .product-card:hover { transform: translateY(-10px); border-color: #eab308; }
        .gradient-btn { background: linear-gradient(90deg, #eab308 0%, #ca8a04 100%); color: black; }
        
        /* العلامات الخضراء والحمراء */
        .status-dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; margin-left: 5px; }
        .dot-online { background-color: #22c55e; box-shadow: 0 0 10px #22c55e; }
        .dot-offline { background-color: #ef4444; box-shadow: 0 0 10px #ef4444; }

        /* رسالة قريبا بتنسيق اللوجو */
        .soon-msg {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.95); padding: 30px 60px; border: 2px solid #eab308;
            z-index: 10000; border-radius: 20px; text-align: center;
            box-shadow: 0 0 50px rgba(234,179,8,0.3);
        }
        .soon-logo { font-weight: 900; font-style: italic; font-size: 2.5rem; letter-spacing: -2px; }

        .hero-bg { 
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1534438327276-14e5300c3a48?auto=format&fit=crop&w=1920&q=80'); 
            background-size: cover; background-position: center; 
        }
        body::after { 
            content: "Developed by: Yassin El-Sebaey Developer"; 
            position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); 
            font-size: 10px; text-transform: uppercase; color: rgba(255, 255, 255, 0.1); 
            letter-spacing: 2px; z-index: 9999; pointer-events: none; 
        }
    </style>
</head>
<body>

    <nav class="glass-nav fixed w-full z-50 py-4 px-6">
        <div class="container mx-auto flex justify-between items-center">
            <div class="text-3xl font-black text-yellow-500 italic tracking-tighter">3DLAT<span class="text-white">STORE</span></div>
            <div class="hidden md:flex gap-8 font-bold text-sm">
                <a href="index.html" class="text-yellow-500">الرئيسية</a>
                <a href="#products">المنتجات</a>
                <a href="#reviews">آراء الأبطال</a>
            </div>
            <div class="text-2xl cursor-pointer"><a href="cart.html">🛒</a></div>
        </div>
    </nav>

    <section class="hero-bg h-screen flex items-center justify-center relative">
        <div class="relative z-10 text-center px-4" data-aos="zoom-in">
            <h1 class="text-6xl md:text-8xl font-black hero-text mb-6 uppercase italic">تحدى <span class="text-yellow-500">حدودك</span></h1>
            <p class="text-xl md:text-2xl text-gray-300 mb-10 font-bold italic">أقوى المكملات العالمية الأصلية الآن في مصر.</p>
            <a href="#products" class="gradient-btn font-black px-12 py-4 rounded-full inline-block">تسوق الآن</a>
        </div>
    </section>

    <section id="products" class="container mx-auto py-24 px-6">
        <div class="flex items-center gap-4 mb-16" data-aos="fade-left">
            <div class="h-10 w-2 bg-yellow-500"></div>
            <h2 class="text-4xl font-black italic uppercase tracking-tighter">أقوى العروض</h2>
        </div>
        <div id="product-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10"></div>
    </section>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({ duration: 1000, once: true });

        // --- [ لوحة تحكم ياسين ] ---
        // الطريقة: اكتب 1 للمتوفر و 0 للغير متوفر في الـ status
        const myProducts = [
            { img: "كرياتين_بيج_رامي_1000.jpg", status: 1 },
            { img: "كرياتين_رول_ون_1300.jpg", status: 0 }, // غير متوفر
            { img: "تراكتور_الالماني_1200.jpeg", status: 1 },
            ...Array(47).fill({ img: "منتج_قريبا_000.jpg", status: 1 })
        ];

        const container = document.getElementById('product-list');

        myProducts.forEach((item, index) => {
            let file = item.img;
            let cleanName = file.split('.').slice(0, -1).join('.'); 
            let parts = cleanName.split('_');
            let price = parts.pop(); 
            let name = parts.join(' '); 

            if (name.includes("منتج قريبا") || price === "000") return;

            // تحديد الحالة
            const isOnline = item.status === 1;
            const dotClass = isOnline ? "dot-online" : "dot-offline";
            const btnAction = isOnline ? `onclick="saveAndGo('${name}', '${price}', '${file}')"` : `onclick="showSoon()"`;

            container.innerHTML += `
                <div class="product-card p-4 rounded-3xl group flex flex-col" data-aos="fade-up">
                    <div class="absolute top-6 right-6 z-10 flex items-center bg-black/50 px-3 py-1 rounded-full border border-white/10">
                        <span class="status-dot ${dotClass}"></span>
                        <span class="text-[10px] font-bold">${isOnline ? 'متوفر' : 'غير متوفر'}</span>
                    </div>
                    <div class="relative h-80 rounded-2xl overflow-hidden bg-[#0a0a0a] flex items-center justify-center p-6">
                        <img src="${file}" class="h-full object-contain transform group-hover:scale-110 transition duration-500">
                    </div>
                    <div class="p-6 text-right flex-grow flex flex-col">
                        <h3 class="text-xl font-black mb-4 uppercase italic tracking-tighter">${name}</h3>
                        <div class="mt-auto flex items-center justify-between border-t border-white/5 pt-4">
                            <span class="text-3xl font-black text-yellow-500">${price} <small class="text-xs">EGP</small></span>
                            <button ${btnAction} class="gradient-btn px-6 py-2 rounded-xl font-bold shadow-lg">🛒 اطلب</button>
                        </div>
                    </div>
                </div>`;
        });

        function showSoon() {
            const div = document.createElement('div');
            div.className = 'soon-msg';
            div.innerHTML = `
                <div class="soon-logo text-yellow-500">3DLAT<span class="text-white">STORE</span></div>
                <div class="text-white font-bold mt-4 text-xl italic uppercase">قريباً جداً !</div>
            `;
            document.body.appendChild(div);
            setTimeout(() => div.remove(), 2000);
        }

        function saveAndGo(name, price, img) {
            localStorage.setItem('selectedProduct', name);
            localStorage.setItem('selectedPrice', price);
            localStorage.setItem('selectedImg', img);
            window.location.href = 'product.html'; 
        }
    </script>
</body>
</html>
