<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3DLAT STORE | الملحمة الرياضية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; scroll-behavior: smooth; background-color: #0f0f0f; color: white; overflow-x: hidden; }
        .glass-nav { background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,0.05); }
        .hero-text { text-shadow: 0 0 20px rgba(234, 179, 8, 0.5); }
        .product-card { background: #1a1a1a; transition: 0.5s; border: 1px solid #222; position: relative; }
        .product-card:hover { transform: translateY(-10px); border-color: #eab308; }
        .gradient-btn { background: linear-gradient(90deg, #eab308 0%, #ca8a04 100%); color: black; }
        .out-of-stock-btn { background: #333; color: #777; cursor: not-allowed; }
        .hero-bg { 
            background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)), url('https://images.unsplash.com/photo-1534438327276-14e5300c3a48?auto=format&fit=crop&w=1920&q=80'); 
            background-size: cover; background-position: center; 
        }
        /* الحالة (متوفر / غير متوفر) */
        .status-badge { position: absolute; top: 15px; right: 15px; padding: 4px 12px; border-radius: 50px; font-size: 12px; font-weight: bold; z-index: 10; display: flex; items-center: center; gap: 5px; }
        .status-available { background: rgba(34, 197, 94, 0.2); color: #22c55e; border: 1px solid #22c55e; }
        .status-out { background: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid #ef4444; }

        body::after { 
            content: "Developed by: Yassin El-Sebaey Developer"; 
            position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); 
            font-size: 10px; text-transform: uppercase; color: rgba(255, 255, 255, 0.1); 
            letter-spacing: 2px; z-index: 9999; pointer-events: none; 
        }

        /* تعديلات الموبايل */
        @media (max-width: 768px) {
            .hero-text { font-size: 3.5rem !important; }
            .section-title { font-size: 1.8rem !important; }
        }
    </style>
</head>
<body>

    <nav class="glass-nav fixed w-full z-50 py-3 md:py-4 px-4 md:px-6">
        <div class="container mx-auto flex justify-between items-center">
            <div class="text-2xl md:text-3xl font-black text-yellow-500 italic tracking-tighter">3DLAT<span class="text-white">STORE</span></div>
            <div class="hidden md:flex gap-8 font-bold text-sm">
                <a href="index.html" class="text-yellow-500">الرئيسية</a>
                <a href="#products">المنتجات</a>
                <a href="#reviews">آراء الأبطال</a>
                <a href="checkout.html">إتمام الطلب</a>
            </div>
            <div class="text-2xl cursor-pointer"><a href="cart.html">🛒</a></div>
        </div>
    </nav>

    <section class="hero-bg h-[90vh] md:h-screen flex items-center justify-center relative px-6">
        <div class="relative z-10 text-center" data-aos="zoom-in">
            <h1 class="text-5xl md:text-8xl font-black hero-text mb-4 md:mb-6 uppercase italic leading-none">تحدى <span class="text-yellow-500">حدودك</span></h1>
            <p class="text-lg md:text-2xl text-gray-300 mb-8 md:mb-10 font-bold italic max-w-xl mx-auto">أقوى المكملات العالمية الأصلية الآن في مصر.</p>
            <a href="#products" class="gradient-btn font-black px-10 md:px-12 py-3 md:py-4 rounded-full inline-block shadow-lg hover:scale-105 transition">تسوق الآن</a>
        </div>
    </section>

    <section id="products" class="container mx-auto py-16 md:py-24 px-4 md:px-6">
        <div class="flex items-center gap-4 mb-12 md:mb-16" data-aos="fade-left">
            <div class="h-8 md:h-10 w-2 bg-yellow-500"></div>
            <h2 class="text-3xl md:text-4xl font-black italic uppercase tracking-tighter section-title">أقوى العروض</h2>
        </div>
        
        <div id="product-list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 md:gap-10">
            </div>
    </section>

    <footer class="border-t border-white/5 py-10 bg-black text-center text-gray-600">
        <div class="text-xl font-black text-yellow-500 mb-2 italic">3DLAT STORE</div>
        <p class="text-xs font-bold">© 2026 - جميع الحقوق محفوظة لـ ياسين السباعي</p>
    </footer>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({ duration: 800, once: true });

        // --- [ لوحة تحكم ياسين الذكية ] ---
        // نصيحة: لو المنتج خلص ضيف كلمة "خلصان" في اسم الصورة
        const myProducts = [
            "كرياتين_بيج_رامي_60_جرعه_1000.jpg",
            "كرياتين_رول_ون_خلصان_1300.jpg", // ده هيظهر "غير متوفر" تلقائياً
            "كرياتين_ترياكتور_الالماني_180_جرعه_1200.jpeg",
            "واي_بروتين_جولد_خلصان_2400.png", // ده برضه هيظهر "غير متوفر"
            ...Array(46).fill("منتج_قريبا_000.jpg") 
        ];

        const container = document.getElementById('product-list');

        myProducts.forEach((file, index) => {
            let cleanName = file.split('.').slice(0, -1).join('.'); 
            let parts = cleanName.split('_');
            let price = parts.pop(); 
            let name = parts.join(' '); 

            if (name.includes("منتج قريبا") || price === "000") return; 

            // التحقق من التوفر
            const isAvailable = !name.includes("خلصان");
            const displayName = name.replace("خلصان", "").trim();
            
            const statusClass = isAvailable ? "status-available" : "status-out";
            const statusText = isAvailable ? "● متوفر" : "● غير متوفر";
            const btnClass = isAvailable ? "gradient-btn" : "out-of-stock-btn";
            const btnAction = isAvailable ? `onclick="saveAndGo('${displayName}', '${price}', '${file}')"` : `onclick="alertSoon()"`;
            const btnLabel = isAvailable ? "🛒 اطلب الآن" : "قريباً !";

            container.innerHTML += `
                <div class="product-card p-4 rounded-2xl md:rounded-3xl flex flex-col" data-aos="fade-up">
                    <div class="${statusClass} status-badge">${statusText}</div>
                    <div class="relative h-64 md:h-80 rounded-xl md:rounded-2xl overflow-hidden bg-[#0a0a0a] flex items-center justify-center p-4">
                        <img src="${file}" class="h-full object-contain transform group-hover:scale-110 transition duration-500" 
                             onerror="this.src='https://via.placeholder.com/400x400/1a1a1a/eab308?text=3DLAT+STORE'">
                    </div>
                    <div class="p-4 md:p-6 text-right flex-grow flex flex-col">
                        <h3 class="text-lg md:text-xl font-black mb-4 uppercase italic tracking-tighter">${displayName}</h3>
                        <div class="mt-auto flex items-center justify-between border-t border-white/5 pt-4">
                            <span class="text-2xl md:text-3xl font-black text-yellow-500">${price} <small class="text-[10px]">EGP</small></span>
                            <button ${btnAction} class="${btnClass} px-4 md:px-6 py-2 rounded-xl font-bold transition shadow-lg text-sm md:text-base">
                                ${btnLabel}
                            </button>
                        </div>
                    </div>
                </div>`;
        });

        function alertSoon() {
            // رسالة قريباً بالأسود والذهبي
            const msg = document.createElement('div');
            msg.innerHTML = "قريباً جداً في 3DLAT STORE!";
            msg.style = "position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); background:#eab308; color:#000; padding:20px 40px; border-radius:10px; font-weight:900; z-index:10000; border:4px solid #000; box-shadow:0 0 50px rgba(234,179,8,0.5);";
            document.body.appendChild(msg);
            setTimeout(() => msg.remove(), 2000);
        }

        function saveAndGo(name, price, img) {
            localStorage.setItem('selectedProduct', name);
            localStorage.setItem('selectedPrice', price);
            localStorage.setItem('selectedImg', img);
            window.location.href = 'product.html'; 
        }
    </script>
</body>
</html>
