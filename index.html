<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3DLAT STORE | الملحمة الرياضية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; scroll-behavior: smooth; background-color: #0f0f0f; color: white; }
        .glass-nav { background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,0.05); }
        .hero-text { text-shadow: 0 0 20px rgba(234, 179, 8, 0.5); }
        .product-card { background: #1a1a1a; transition: 0.5s; border: 1px solid #222; overflow: hidden; position: relative; }
        .product-card:hover { transform: translateY(-10px); border-color: #eab308; }
        .gradient-btn { background: linear-gradient(90deg, #eab308 0%, #ca8a04 100%); color: black; }
        
        .status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-left: 6px; }
        .dot-online { background-color: #22c55e; box-shadow: 0 0 10px #22c55e; }
        .dot-offline { background-color: #ef4444; box-shadow: 0 0 10px #ef4444; }

        .old-price { text-decoration: line-through; color: #666; font-size: 0.9rem; margin-left: 8px; }

        .hero-bg { 
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1534438327276-14e5300c3a48?auto=format&fit=crop&w=1920&q=80'); 
            background-size: cover; background-position: center; 
        }
        body::after { 
            content: "Developed by: Yassin El-Sebaey Developer"; 
            position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); 
            font-size: 10px; text-transform: uppercase; color: rgba(255, 255, 255, 0.1); 
            letter-spacing: 2px; z-index: 9999; pointer-events: none; 
        }
    </style>
</head>
<body>

    <nav class="glass-nav fixed w-full z-50 py-4 px-6">
        <div class="container mx-auto flex justify-between items-center">
            <div class="text-3xl font-black text-yellow-500 italic tracking-tighter">3DLAT<span class="text-white">STORE</span></div>
            <div class="hidden md:flex gap-8 font-bold text-sm">
                <a href="#products" class="text-yellow-500">المنتجات</a>
                <a href="#" class="hover:text-yellow-500 transition">الرئيسية</a>
            </div>
            <div class="text-2xl cursor-pointer"><a href="cart.html">🛒</a></div>
        </div>
    </nav>

    <section class="hero-bg h-[70vh] flex items-center justify-center relative px-4 text-center">
        <div class="relative z-10" data-aos="zoom-in">
            <h1 class="text-5xl md:text-7xl font-black hero-text mb-6 uppercase italic leading-none">أقوى <span class="text-yellow-500">العروض</span></h1>
            <p class="text-lg md:text-xl text-gray-300 mb-10 font-bold">جميع مكملات Dr.Supps الأصلية بخصومات حصرية.</p>
        </div>
    </section>

    <section id="products" class="container mx-auto py-16 px-6">
        <div class="flex items-center gap-4 mb-16" data-aos="fade-left">
            <div class="h-10 w-2 bg-yellow-500"></div>
            <h2 class="text-4xl font-black italic uppercase tracking-tighter">قائمة المنتجات الكاملة</h2>
        </div>
        <div id="product-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10"></div>
    </section>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({ duration: 1000, once: true });

        // مصفوفة المنتجات (الاسم_السعرالأصلي)
        // سيقوم الكود تلقائياً بحساب الخصم وعرض السعرين
        const rawProducts = [
            "سيرياس_ماس_أوبتيموم_5.4_كيلو_4700",
            "كيفن_لفروني_جولد_واي_2_كيلو_3600",
            "نوفوجين_ماس_جينر_5.4_كيلو_2500",
            "دايماتايز_أيزو_100_20_جرعة_2000",
            "إيفولف_واي_بروتين_1_كيلو_2000",
            "ريد_ريكس_بيج_واي_1_كيلو_1850",
            "ريد_ريكس_أول_إن_بروتين_1300",
            "كريا_باور_كريابيور_80_جرعة_1225",
            "دي_واي_نيوترشن_كرياتين_60_جرعة_1100",
            "ليبو_6_بلاك_ألترا_60_كبسولة_975",
            "ون_رو_كرياتين_100_جرعة_950",
            "ريد_ريكس_كرياتين_60_جرعة_925",
            "كريا_باور_كريابيور_50_جرعة_825",
            "كوماندوز_هيل_فاير_كرياتين_300",
            "باقة_دراجون_كرياتين_و_سيترولين_1250",
            "باقة_تراكتور_كرياتين_و_سيترولين_1000",
            "باقة_بيورجانيك_كرياتين_و_بيتا_650",
            "سيترولين_مالات_نوفوجين_850",
            "أر جينين_نوفوجين_90_تبلت_750",
            "بي_سي_ايه_ايه_نوفوجين_1100",
            "جلوتامين_نوفوجين_300_جرام_800",
            "تريبولوس_تيريس_تريس_650",
            "مالتي_فيتامين_ألفا_60_تابلت_550",
            "أوميجا_3_نوفوجين_100_كبسولة_600",
            "زد_ام_ايه_نوفوجين_90_كبسولة_700"
        ];

        const container = document.getElementById('product-list');

        rawProducts.forEach((item) => {
            let parts = item.split('_');
            let originalPrice = parseInt(parts.pop());
            let name = parts.join(' ');
            
            // حساب الخصم تلقائياً (50 جنيه للمنتجات الغالية و 25 للرخيصة)
            let discount = originalPrice > 1000 ? 50 : 25;
            let currentPrice = originalPrice - discount;

            container.innerHTML += `
                <div class="product-card p-4 rounded-3xl group flex flex-col" data-aos="fade-up">
                    <div class="absolute top-6 right-6 z-10 flex items-center bg-yellow-500 px-3 py-1 rounded-full">
                        <span class="text-[10px] font-black text-black uppercase tracking-widest">خصم لفترة محدودة</span>
                    </div>
                    
                    <div class="relative h-64 rounded-2xl overflow-hidden bg-[#0a0a0a] flex items-center justify-center p-6">
                        <div class="text-yellow-500 font-black text-4xl opacity-20 absolute">3DLAT</div>
                        <img src="${item}.jpg" class="h-full object-contain transform group-hover:scale-110 transition duration-500" onerror="this.src='https://via.placeholder.com/300?text=Product+Image'">
                    </div>
                    
                    <div class="p-6 text-right flex-grow flex flex-col">
                        <h3 class="text-lg font-black mb-4 uppercase italic tracking-tighter h-12 overflow-hidden">${name}</h3>
                        <div class="mt-auto flex flex-col gap-2 border-t border-white/5 pt-4">
                            <div class="flex items-center justify-between">
                                <span class="old-price">${originalPrice} EGP</span>
                                <span class="text-2xl font-black text-yellow-500">${currentPrice} <small class="text-xs">EGP</small></span>
                            </div>
                            <button onclick="saveAndGo('${name}', '${currentPrice}', '${item}.jpg')" class="gradient-btn w-full py-3 rounded-xl font-bold shadow-lg transform active:scale-95 transition">🛒 اطلب العرض الآن</button>
                        </div>
                    </div>
                </div>`;
        });

        function saveAndGo(name, price, img) {
            localStorage.setItem('selectedProduct', name);
            localStorage.setItem('selectedPrice', price);
            localStorage.setItem('selectedImg', img);
            window.location.href = 'product.html'; 
        }
    </script>
</body>
</html>
