<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3DLAT STORE | Yassin El-Sebaey</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #0f0f0f; color: white; scroll-behavior: smooth; }
        .glass-nav { background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,0.05); }
        .product-card { background: #1a1a1a; transition: 0.4s; border: 1px solid #222; }
        .product-card:hover { transform: translateY(-10px); border-color: #eab308; }
        .gradient-btn { background: linear-gradient(90deg, #eab308 0%, #ca8a04 100%); color: black; }
        .watermark { position: fixed; bottom: 10px; left: 10px; font-size: 10px; text-transform: uppercase; color: rgba(255, 255, 255, 0.1); letter-spacing: 2px; pointer-events: none; z-index: 99; font-family: sans-serif; }
        .hero-section { background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1517836357463-d25dfeac3438?auto=format&fit=crop&w=1920&q=80'); background-size: cover; background-position: center; }
    </style>
</head>
<body>

    <!-- Watermark by Yassin -->
    <div class="watermark">Dev: Yassin El-Sebaey 01550434880</div>

    <!-- Navigation -->
    <nav class="glass-nav fixed w-full z-50 py-4 px-6">
        <div class="container mx-auto flex justify-between items-center">
            <div class="text-3xl font-black text-yellow-500 italic">3DLAT<span class="text-white">STORE</span></div>
            <div class="hidden md:flex gap-8 font-bold text-sm">
                <a href="#" class="text-yellow-500">الرئيسية</a>
                <a href="#products" class="hover:text-yellow-500 transition">المتجر</a>
                <a href="https://wa.me/201550434880" class="hover:text-yellow-500 transition">تواصل معنا</a>
            </div>
        </div>
    </nav>

    <!-- Hero -->
    <section class="hero-section h-screen flex items-center justify-center text-center">
        <div>
            <h1 class="text-5xl md:text-7xl font-black mb-6 italic uppercase">اقوى مكملات في <span class="text-yellow-500">مصر</span></h1>
            <p class="text-lg text-gray-300 mb-10 font-bold italic">أصلي 100% - شحن سريع - أرخص سعر</p>
            <a href="#products" class="gradient-btn font-black px-10 py-4 rounded-full inline-block shadow-lg">تسوق المنتجات</a>
        </div>
    </section>

    <!-- Products -->
    <section id="products" class="container mx-auto py-24 px-6">
        <h2 class="text-4xl font-black mb-16 italic border-r-4 border-yellow-500 pr-4">المتجر الحصري</h2>
        <div id="product-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10">
            <!-- المنتجات ستظهر هنا عبر الجافا سكريبت -->
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-black py-10 border-t border-white/5 text-center">
        <p class="text-gray-500 text-xs">Developed by: Yassin El-Sebaey | 01550434880</p>
    </footer>

    <!-- زر واتساب العائم برقم ياسين الجديد -->
    <a href="https://wa.me/201550434880" class="fixed bottom-6 right-6 bg-[#25d366] w-14 h-14 rounded-full flex items-center justify-center text-white text-2xl shadow-2xl z-50">
        <i class="fab fa-whatsapp"></i>
    </a>

    <script>
        // مصفوفة المنتجات
        const myProducts = [
            { id: 1, name: "كرياتين انابوليك الامريكي", price: 1000, img: "creatine_anabolic.jpg" },
            { id: 2, name: "باور C4 الاصلي", price: 2200, img: "c4_power.jpg" },
            { id: 3, name: "واي بروتين ازجارد", price: 3500, img: "asgard_whey.jpg" }
        ];

        const container = document.getElementById('product-list');

        myProducts.forEach(product => {
            container.innerHTML += `
                <div class="product-card p-6 rounded-3xl flex flex-col">
                    <img src="${product.img}" class="h-64 object-contain mb-6 rounded-2xl bg-black/40 p-4" onerror="this.src='https://via.placeholder.com/300?text=3DLAT+STORE'">
                    <h3 class="text-xl font-black mb-4 italic">${product.name}</h3>
                    <div class="flex justify-between items-center mt-auto">
                        <span class="text-2xl font-black text-yellow-500">${product.price} <small class="text-xs">ج.م</small></span>
                        <button onclick="buyNow('${product.name}', '${product.price}', '${product.img}')" class="gradient-btn px-6 py-2 rounded-xl font-black text-sm">شراء الآن</button>
                    </div>
                </div>
            `;
        });

        function buyNow(name, price, img) {
            localStorage.setItem('selectedProduct', name);
            localStorage.setItem('selectedPrice', price);
            localStorage.setItem('selectedImg', img);
            window.location.href = 'checkout.html';
        }
    </script>
</body>
</html>
