<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إتمام الطلب | 3DLAT STORE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #050505; color: white; min-height: 100vh; }
        input, select { background: #111 !important; border: 1px solid #222 !important; color: white !important; transition: 0.3s; }
        input:focus { border-color: #eab308 !important; outline: none; box-shadow: 0 0 10px rgba(234, 179, 8, 0.1); }
        .checkout-card { background: #0a0a0a; border: 1px solid #1a1a1a; }
        
        /* العلامة المائية لياسين السباعي */
        .watermark {
            position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%);
            font-size: 10px; text-transform: uppercase; color: rgba(255, 255, 255, 0.1);
            letter-spacing: 2px; pointer-events: none; z-index: 99;
        }
    </style>
</head>
<body class="pb-10">

    <nav class="p-6 border-b border-white/5 mb-10">
        <div class="container mx-auto">
            <a href="index.html" class="text-2xl font-black italic text-yellow-500">3DLAT<span class="text-white">STORE</span></a>
        </div>
    </nav>

    <div class="container mx-auto px-6 max-w-4xl">
        <div class="flex flex-col lg:flex-row gap-10">
            
            <div class="lg:w-1/3 order-2 lg:order-1">
                <div class="checkout-card p-6 rounded-[2rem] sticky top-24">
                    <h2 class="text-xl font-black mb-6 border-b border-white/5 pb-4 italic">ملخص الطلب</h2>
                    <div class="text-center">
                        <img id="itemImg" src="" class="h-40 w-full object-contain mb-4 bg-black rounded-2xl p-4">
                        <h3 id="itemName" class="text-lg font-bold text-yellow-500 mb-2">جاري التحميل...</h3>
                        <p class="text-2xl font-black"><span id="itemPrice">0</span> ج.م</p>
                    </div>
                </div>
            </div>

            <div class="lg:w-2/3 order-1 lg:order-2">
                <div class="checkout-card p-8 rounded-[2.5rem]">
                    <h1 class="text-3xl font-black mb-8 italic">بيانات <span class="text-yellow-500">الشحن</span></h1>
                    
                    <form onsubmit="sendToWhatsApp(event)" class="space-y-6">
                        <div>
                            <label class="block text-sm font-bold mb-2 text-gray-500">الاسم بالكامل</label>
                            <input type="text" id="custName" required class="w-full p-4 rounded-xl" placeholder="ادخل اسمك الثلاثي">
                        </div>

                        <div>
                            <label class="block text-sm font-bold mb-2 text-gray-500">رقم الموبايل</label>
                            <input type="tel" id="custPhone" required class="w-full p-4 rounded-xl" placeholder="رقم متاح عليه واتساب">
                        </div>

                        <div>
                            <label class="block text-sm font-bold mb-2 text-gray-500">المحافظة والعنوان بالتفصيل</label>
                            <input type="text" id="custAddress" required class="w-full p-4 rounded-xl" placeholder="المحافظة - المدينة - اسم الشارع">
                        </div>

                        <div>
                            <label class="block text-sm font-bold mb-2 text-gray-500">طريقة الدفع</label>
                            <select id="payMethod" class="w-full p-4 rounded-xl">
                                <option value="الدفع عند الاستلام">الدفع عند الاستلام (COD)</option>
                                <option value="تحويل محفظة">فودافون كاش / محفظة إلكترونية</option>
                            </select>
                        </div>

                        <button type="submit" class="w-full bg-yellow-500 text-black py-5 rounded-2xl font-black text-xl hover:bg-white hover:scale-[1.02] transition duration-300 shadow-xl shadow-yellow-500/10">
                            تأكيد الطلب عبر الواتساب 🚀
                        </button>
                    </form>
                </div>
            </div>

        </div>
    </div>

    <div class="watermark">Developed by: Yassin El-Sebaey Developer</div>

    <script>
        // قراءة بيانات المنتج عند فتح الصفحة
        window.onload = function() {
            const name = localStorage.getItem('selectedProduct');
            const price = localStorage.getItem('selectedPrice');
            const img = localStorage.getItem('selectedImg');

            if (name && price) {
                document.getElementById('itemName').innerText = name;
                document.getElementById('itemPrice').innerText = price;
                document.getElementById('itemImg').src = img || 'placeholder.jpg';
            } else {
                // إذا حاول العميل دخول الصفحة بدون اختيار منتج
                window.location.href = 'index.html';
            }
        };

        // إرسال البيانات للواتساب
        function sendToWhatsApp(event) {
            event.preventDefault();
            
            const product = localStorage.getItem('selectedProduct');
            const price = localStorage.getItem('selectedPrice');
            const name = document.getElementById('custName').value;
            const phone = document.getElementById('custPhone').value;
            const address = document.getElementById('custAddress').value;
            const method = document.getElementById('payMethod').value;

            const myNumber = "3584573985864"; // رقمك يا ياسين
            
            const message = `🚨 *طلب جديد من 3DLAT STORE* 🚨\n\n` +
                            `📦 *المنتج:* ${product}\n` +
                            `💰 *السعر:* ${price} ج.م\n\n` +
                            `👤 *العميل:* ${name}\n` +
                            `📞 *الموبايل:* ${phone}\n` +
                            `📍 *العنوان:* ${address}\n` +
                            `💳 *طريقة الدفع:* ${method}\n\n` +
                            `⚡ _تم الطلب عبر الموقع الرسمي_`;

            const waUrl = `https://wa.me/${myNumber}?text=${encodeURIComponent(message)}`;
            window.open(waUrl, '_blank');
        }
    </script>
</body>
</html>
