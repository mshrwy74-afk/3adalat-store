<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إتمام الطلب | 3DLAT STORE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #050505; color: white; min-height: 100vh; }
        input, select, textarea { background: #111 !important; border: 1px solid #222 !important; color: white !important; transition: 0.3s; width: 100%; }
        input:focus, textarea:focus { border-color: #eab308 !important; outline: none; box-shadow: 0 0 10px rgba(234, 179, 8, 0.1); }
        .checkout-card { background: #0a0a0a; border: 1px solid #1a1a1a; }
        .error-msg { color: #ef4444; font-size: 0.75rem; margin-top: 0.25rem; display: none; }
    </style>
</head>
<body class="pb-10">

    <nav class="p-6 border-b border-white/5 mb-10 text-center">
        <a href="index.html" class="text-2xl font-black italic text-yellow-500">3DLAT<span class="text-white">STORE</span></a>
    </nav>

    <div class="container mx-auto px-6 max-w-4xl">
        <div id="main-content" class="flex flex-col lg:flex-row gap-10">
            
            <!-- ملخص الطلب -->
            <div class="lg:w-1/3">
                <div class="checkout-card p-6 rounded-[2rem]">
                    <h2 class="text-xl font-black mb-6 border-b border-white/5 pb-4 italic">ملخص الطلب</h2>
                    <div class="text-center">
                        <img id="itemImg" src="" class="h-40 w-full object-contain mb-4 bg-black rounded-2xl p-4 border border-white/5">
                        <h3 id="itemName" class="text-lg font-bold text-yellow-500 mb-2 italic">جاري التحميل...</h3>
                        <p class="text-2xl font-black"><span id="itemPrice">0</span> <small class="text-xs">ج.م</small></p>
                    </div>
                </div>
            </div>

            <!-- استمارة البيانات -->
            <div class="lg:w-2/3">
                <div class="checkout-card p-8 rounded-[2.5rem]">
                    <h1 class="text-3xl font-black mb-8 italic">بيانات <span class="text-yellow-500">الشحن</span></h1>
                    
                    <form id="orderForm" onsubmit="handleOrder(event)" class="space-y-6">
                        <div>
                            <label class="block text-sm font-bold mb-2 text-gray-500 italic">الاسم بالكامل (ثلاثي)</label>
                            <input type="text" name="الاسم" id="custName" required class="p-4 rounded-xl">
                            <p id="nameError" class="error-msg">⚠️ يرجى إدخال اسم ثلاثي صحيح.</p>
                        </div>

                        <div>
                            <label class="block text-sm font-bold mb-2 text-gray-500 italic">رقم الموبايل</label>
                            <input type="tel" name="الموبايل" id="custPhone" required class="p-4 rounded-xl">
                            <p id="phoneError" class="error-msg">⚠️ رقم موبايل غير صحيح.</p>
                        </div>

                        <div>
                            <label class="block text-sm font-bold mb-2 text-gray-500 italic">العنوان بالتفصيل الممل</label>
                            <textarea name="العنوان" id="custAddress" required class="p-4 rounded-xl h-32"></textarea>
                            <p id="addressError" class="error-msg">⚠️ يرجى كتابة عنوان مفصل (أكثر من 50 حرف).</p>
                        </div>

                        <!-- حقول مخفية للمنتج -->
                        <input type="hidden" name="المنتج" id="hiddenProduct">
                        <input type="hidden" name="السعر" id="hiddenPrice">

                        <button type="submit" id="submitBtn" class="w-full bg-yellow-500 text-black py-5 rounded-2xl font-black text-xl hover:bg-white transition duration-300">
                            تأكيد الطلب الآن 📦
                        </button>
                    </form>
                </div>
            </div>

        </div>
    </div>

    <script>
        // تحميل بيانات المنتج من localStorage
        window.onload = function() {
            const name = localStorage.getItem('selectedProduct');
            const price = localStorage.getItem('selectedPrice');
            const img = localStorage.getItem('selectedImg');

            if (name && price) {
                document.getElementById('itemName').innerText = name;
                document.getElementById('itemPrice').innerText = price;
                document.getElementById('itemImg').src = img;
                document.getElementById('hiddenProduct').value = name;
                document.getElementById('hiddenPrice').value = price;
            }
        };

        async function handleOrder(event) {
            event.preventDefault();
            const btn = document.getElementById('submitBtn');
            const name = document.getElementById('custName').value.trim();
            const phone = document.getElementById('custPhone').value.trim();
            const address = document.getElementById('custAddress').value.trim();

            // التحقق من البيانات
            let valid = true;
            document.querySelectorAll('.error-msg').forEach(e => e.style.display = 'none');

            if (name.split(/\s+/).length < 3) { document.getElementById('nameError').style.display = 'block'; valid = false; }
            if (!/^(010|011|012|015)[0-9]{8}$/.test(phone)) { document.getElementById('phoneError').style.display = 'block'; valid = false; }
            if (address.length < 50) { document.getElementById('addressError').style.display = 'block'; valid = false; }

            if (!valid) return;

            // إرسال البيانات
            btn.disabled = true;
            btn.innerText = "جاري إرسال طلبك... ⏳";

            const formData = new FormData(event.target);

            try {
                const response = await fetch('https://formspree.io/f/xrejepwv', {
                    method: 'POST',
                    body: formData,
                    headers: { 'Accept': 'application/json' }
                });

                if (response.ok) {
                    document.getElementById('main-content').innerHTML = `
                        <div class="w-full text-center py-20">
                            <h2 class="text-4xl font-black text-yellow-500 mb-4 italic">تم بنجاح! ✅</h2>
                            <p class="text-xl">وصلنا طلبك يا بطل، سنقوم بالتواصل معك قريباً.</p>
                            <a href="index.html" class="mt-8 inline-block bg-white text-black px-10 py-3 rounded-xl font-bold">العودة للرئيسية</a>
                        </div>
                    `;
                } else {
                    alert("خطأ في الإرسال، حاول مرة أخرى.");
                    btn.disabled = false;
                }
            } catch (err) {
                alert("تأكد من اتصالك بالإنترنت.");
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
